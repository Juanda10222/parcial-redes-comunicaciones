# Formato de log para registrar peticiones (consumido como referencia por Grafana/Joomla)
log_format proxy_access '$remote_addr - $time_local "$request" '
                         'status=$status bytes=$body_bytes_sent '
                         'upstream="$upstream_addr" host="$host"';

access_log /var/log/nginx/access.log proxy_access;   # log central de accesos

server {
    listen 80;
    server_name _;

    # --- Joomla (raíz del sitio) ---
    location / {
        proxy_pass http://joomla:80;
        proxy_set_header Host $host;                       # Capa 7: cabecera Host original
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # IP real del cliente
        proxy_set_header X-Forwarded-Proto $scheme;         # protocolo original (http/https)
    }

    # --- Jupyter Lab (WebSockets para el kernel) ---
    location /jupyter/ {
        proxy_pass http://jupyter:8888/jupyter/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;             # habilita upgrade HTTP -> WebSocket
        proxy_set_header Connection "upgrade";               # requerido por el kernel de Jupyter
        proxy_read_timeout 86400;                            # evita timeout de sesiones largas
    }

    # --- Grafana ---
    location /grafana/ {
        proxy_pass http://grafana:3000/grafana/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;              # Grafana también usa WebSockets (live)
        proxy_set_header Connection "upgrade";
    }
}
