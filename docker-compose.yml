services:

  # 1. Edge Router / Reverse Proxy - único puerto publicado al host
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"                       # único contenedor con puerto publicado
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro   # config del proxy
      - nginx_logs:/var/log/nginx                                 # logs de acceso (Capa 7)
    depends_on:
      - joomla
      - jupyter
      - grafana
    networks:
      - frontend_net
    restart: unless-stopped

  # 2. CMS institucional (Capa 7)
  joomla:
    image: joomla:latest
    container_name: joomla
    environment:
      JOOMLA_DB_HOST: database                     # nombre de servicio = resolución DNS interna Docker
      JOOMLA_DB_TYPE: pgsql                         # obliga a Joomla a usar PostgreSQL
      JOOMLA_DB_NAME: ${POSTGRES_DB}
      JOOMLA_DB_USER: ${POSTGRES_USER}
      JOOMLA_DB_PASSWORD: ${POSTGRES_PASSWORD}
      JOOMLA_DB_PREFIX: ${JOOMLA_DB_PREFIX}           # fijo (no aleatorio) para poder consultarlo desde fuera de Joomla
      # --- Auto-deployment: se salta por completo el wizard del navegador ---
      JOOMLA_SITE_NAME: ${JOOMLA_SITE_NAME}
      JOOMLA_ADMIN_USER: ${JOOMLA_ADMIN_USER}         # nombre real del Super User
      JOOMLA_ADMIN_USERNAME: ${JOOMLA_ADMIN_USERNAME} # username para login
      JOOMLA_ADMIN_PASSWORD: ${JOOMLA_ADMIN_PASSWORD} # min. 12 caracteres
      JOOMLA_ADMIN_EMAIL: ${JOOMLA_ADMIN_EMAIL}
    volumes:
      - joomla_data:/var/www/html                  # persistencia de assets/código de Joomla
      - nginx_logs:/var/log/nginx                  # logs compartidos con Nginx/Grafana
    depends_on:
      database:
        condition: service_healthy                 # evita migrar antes de que la BD acepte conexiones
    networks:
      - frontend_net                                # visible para nginx
      - backend_net                                 # visible para postgres
    restart: unless-stopped

  # 3. Motor de persistencia relacional (obligatorio)
  database:
    image: postgres:16-alpine
    container_name: database
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data            # persistencia obligatoria
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend_net                                 # SIN visibilidad hacia la red externa/frontend
    restart: unless-stopped

  # 4. Entorno de ciencia de datos con notebook precargado
  jupyter:
    build: ./jupyter                                # imagen con librerías pre-instaladas (ver jupyter/Dockerfile)
    container_name: jupyter
    environment:
      JUPYTER_ENABLE_LAB: "yes"
      POSTGRES_HOST: database                       # usado dentro del notebook para conectarse a la BD
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: >
      start-notebook.sh
      --NotebookApp.base_url=/jupyter
      --NotebookApp.token=''
      --NotebookApp.password=''
      --NotebookApp.allow_origin='*'
      --NotebookApp.tornado_settings="{'headers':{'Content-Security-Policy':\"frame-ancestors 'self'\"}}"
    volumes:
      - ./jupyter/notebooks:/home/jovyan/work        # bind-mount con el cuaderno precargado
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend_net                                 # visible para nginx (WebSockets del kernel)
      - backend_net                                  # necesita consultar PostgreSQL
    restart: unless-stopped

  # 5. Monitoreo y dashboards con provisioning automático
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"              # permite ver paneles sin login manual al evaluar
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro   # datasource + dashboard declarativos
      - grafana_data:/var/lib/grafana
    depends_on:
      database:
        condition: service_healthy
    networks:
      - frontend_net
      - backend_net                                  # consulta directa de métricas a la BD
    restart: unless-stopped

  # Seed: inserta el módulo con la infografía automáticamente (sin tocar Joomla a mano)
  seed:
    image: postgres:16-alpine          # ya trae el cliente psql, no hace falta otra imagen
    container_name: seed
    environment:
      POSTGRES_HOST: database
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JOOMLA_DB_PREFIX: ${JOOMLA_DB_PREFIX}
    volumes:
      - ./seed:/seed:ro                # script + HTML de la infografía
    entrypoint: ["sh", "/seed/seed.sh"]
    depends_on:
      database:
        condition: service_healthy
      joomla:
        condition: service_started
    networks:
      - backend_net                    # solo necesita hablarle a database
    restart: "no"                       # corre una vez por cada "up", no se queda vivo

networks:
  frontend_net:                # nginx, joomla, jupyter, grafana
    driver: bridge
  backend_net:                 # joomla, database, jupyter, grafana (aislada del host)
    driver: bridge
    internal: false             # false para permitir pull de imágenes; database no tiene puertos expuestos al host

volumes:
  db_data:                     # /var/lib/postgresql/data
  joomla_data:                 # assets y código de Joomla
  grafana_data:                # estado interno de Grafana
  nginx_logs:                  # logs de acceso compartidos
